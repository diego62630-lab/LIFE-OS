
name: Build LIFE OS Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'app.js'
      - 'database.js'
      - 'voice.js'
      - 'style.css'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer LIFE OS
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparer LIFE OS
        run: |
          mkdir -p www
          cp index.html app.js database.js voice.js style.css manifest.json service-worker.js www/
          cp icon-192.png www/
          cp -r Icons www/

          cat > package.json <<'EOF'
          {
            "name": "life-os",
            "version": "1.0.0",
            "private": true,
            "description": "LIFE OS Android app"
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.lifeos.app",
            "appName": "LIFE OS",
            "webDir": "www"
          }
          EOF

          npm install @capacitor/core @capacitor/android @capacitor/cli

      - name: Creer application Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Construire APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: LIFE-OS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
